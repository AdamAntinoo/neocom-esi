  /characters/{character_id}/corporationhistory/:
    get:
      description: 'Get a list of all the corporations a character has been a member of


        ---

        Alternate route: `/dev/characters/{character_id}/corporationhistory/`


        Alternate route: `/legacy/characters/{character_id}/corporationhistory/`


        Alternate route: `/v1/characters/{character_id}/corporationhistory/`


        Alternate route: `/v2/characters/{character_id}/corporationhistory/`


        ---

        This route is cached for up to 86400 seconds'
      operationId: get_characters_character_id_corporationhistory
      parameters:
      - $ref: '#/components/parameters/character_id'
      - $ref: '#/components/parameters/datasource'
      - $ref: '#/components/parameters/If-None-Match'
      responses:
        '200':
          description: Corporation history for the given character
          headers:
            Cache-Control:
              description: The caching mechanism used
              schema:
                type: string
            ETag:
              description: RFC7232 compliant entity tag
              schema:
                type: string
            Expires:
              description: RFC7231 formatted datetime string
              schema:
                type: string
            Last-Modified:
              description: RFC7231 formatted datetime string
              schema:
                type: string
          content:
            application/json:
              schema:
                description: 200 ok array
                items:
                  description: 200 ok object
                  properties:
                    corporation_id:
                      description: corporation_id integer
                      format: int32
                      title: get_characters_character_id_corporationhistory_corporation_id
                      type: integer
                    is_deleted:
                      description: True if the corporation has been deleted
                      title: get_characters_character_id_corporationhistory_is_deleted
                      type: boolean
                    record_id:
                      description: An incrementing ID that can be used to canonically establish order of records in cases where dates may be ambiguous
                      format: int32
                      title: get_characters_character_id_corporationhistory_record_id
                      type: integer
                    start_date:
                      description: start_date string
                      format: date-time
                      title: get_characters_character_id_corporationhistory_start_date
                      type: string
                  required:
                  - start_date
                  - corporation_id
                  - record_id
                  title: get_characters_character_id_corporationhistory_200_ok
                  type: object
                maxItems: 10000
                title: get_characters_character_id_corporationhistory_ok
                type: array
              examples:
                response:
                  value:
                  - corporation_id: 90000001
                    is_deleted: true
                    record_id: 500
                    start_date: 2016-06-26 20:00:00+00:00
                  - corporation_id: 90000002
                    record_id: 501
